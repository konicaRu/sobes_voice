<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Interview Trainer — тренажёр собеседований</title>
  <desc id="d">Вопрос звучит вслух, вы отвечаете голосом, локальная модель разбирает ответ и ставит оценку. Справа пример: звуковая волна ответа, фрагмент расшифровки и оценка 4 из 5.</desc>
  <rect width="1200" height="360" rx="26" fill="#0f1419"/>
  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="2" fill="#f2b134">ЛОКАЛЬНЫЙ ГОЛОСОВОЙ ТРЕНАЖЁР</text>
    <text x="0" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="700" fill="#f4efe6">Interview</text>
    <text x="0" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="700" fill="#f4efe6">Trainer</text>
    <text x="0" y="292" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#8b949e">Вопрос звучит вслух, вы отвечаете голосом,</text>
    <text x="0" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" fill="#8b949e">модель на вашем компьютере разбирает ответ.</text>
  </g>
